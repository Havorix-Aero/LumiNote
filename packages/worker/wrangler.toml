name = "luminote"
main = "src/index.ts"
compatibility_date = "2024-11-06"
compatibility_flags = ["nodejs_compat"]

# The SPA is built into apps/web/dist and served from the same origin as the API.
# SPA fallback is handled in src/index.ts, which keeps behaviour identical under
# `wrangler dev`, production, and the Vitest Workers pool.
[assets]
directory = "../../apps/web/dist"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "luminote"
# Replace with the id printed by: wrangler d1 create luminote
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "AUDIO"
bucket_name = "luminote-audio"

[triggers]
crons = ["17 3 * * *"]

[vars]
ENVIRONMENT = "development"
LLM_PROVIDER = "mock"
LLM_BASE_URL = "https://api.deepseek.com/v1"
LLM_MODEL = "deepseek-chat"
STT_PROVIDER = "mock"

[env.production]
[env.production.vars]
ENVIRONMENT = "production"
LLM_PROVIDER = "deepseek"
LLM_BASE_URL = "https://api.deepseek.com/v1"
LLM_MODEL = "deepseek-chat"
STT_PROVIDER = "mock"

[observability]
enabled = true
